name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0

jobs:
  quality:
    name: Rust quality and feature boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo "+$RUST_TOOLCHAIN" fmt --check

      - name: Deny warnings and unsafe code
        run: cargo "+$RUST_TOOLCHAIN" clippy --locked --all-targets --all-features -- -D warnings

      - name: Check minimal feature boundary
        run: |
          cargo "+$RUST_TOOLCHAIN" check --locked --no-default-features
          for feature in document-fonts format pdf raster; do
            cargo "+$RUST_TOOLCHAIN" check --locked --no-default-features --features "$feature"
          done

      - name: Check license metadata
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Verify the crates.io package
        run: cargo "+$RUST_TOOLCHAIN" publish --locked --dry-run

  portable:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Run locked tests with all capabilities
        run: cargo "+${{ env.RUST_TOOLCHAIN }}" test --locked --all-features
