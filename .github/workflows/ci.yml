name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0

jobs:
  quality:
    name: Rust quality and feature boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Check formatting
        run: cargo "+$RUST_TOOLCHAIN" fmt --check

      - name: Deny warnings and unsafe code
        run: cargo "+$RUST_TOOLCHAIN" clippy --locked --all-targets --all-features -- -D warnings

      - name: Check minimal feature boundary
        run: |
          cargo "+$RUST_TOOLCHAIN" check --locked --no-default-features
          for feature in document-fonts format measure pdf raster svg wasm; do
            cargo "+$RUST_TOOLCHAIN" check --locked --no-default-features --features "$feature"
          done

      - name: Check license metadata
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Verify the crates.io package
        run: cargo "+$RUST_TOOLCHAIN" publish --locked --dry-run

  portable:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          test "$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Run locked tests with all capabilities
        run: cargo "+${{ env.RUST_TOOLCHAIN }}" test --locked --all-features

  matrix:
    name: Cross-runtime measurement conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Bun release
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install locked JavaScript dependencies
        working-directory: js/@corbet-labs/ctypst
        run: bun install --frozen-lockfile

      - name: Check JavaScript package tracks the crate release line
        working-directory: js/@corbet-labs/ctypst
        run: |
          js="$(bun -p "require('./package.json').version")"
          crate="$(grep -m1 '^version' ../../../Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          test "$js" = "$crate" || { echo "js $js tracks no crate release ($crate)"; exit 1; }

      - name: Sync generated adapter assets
        working-directory: js/@corbet-labs/ctypst
        run: bash ./scripts/sync-assets.sh

      - name: Type-check the adapter
        working-directory: js/@corbet-labs/ctypst
        run: bun ./node_modules/typescript/bin/tsc --noEmit -p ./tsconfig.json

      - name: Run WASM conformance vectors
        working-directory: js/@corbet-labs/ctypst
        run: bun ./scripts/conformance.mts

      - name: Verify the packed tarball is complete
        working-directory: js/@corbet-labs/ctypst
        run: |
          bun pm pack >/dev/null
          test "$(tar tzf ./*.tgz | grep -c '\.ttf$')" = 16
          rm -f ./*.tgz
