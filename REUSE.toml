version = 1

[[annotations]]
path = [
  ".github/**",
  ".gitignore",
  "Cargo.lock",
  "Cargo.toml",
  "fonts/NOTICE.md",
  "LICENSE.md",
  "README.md",
  "SECURITY.md",
  "REUSE.toml",
  "rust-toolchain.toml",
  "src/**",
  "tests/**",
]
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "FSL-1.1-ALv2"

[[annotations]]
path = ["fonts/*.ttf", "LICENSES/OFL-1.1.txt"]
